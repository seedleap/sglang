      networkCardIndex: 8
    - deviceIndex: 1
      interfaceType: efa-only
      networkCardIndex: 9
    - deviceIndex: 1
      interfaceType: efa-only
      networkCardIndex: 10
    - deviceIndex: 1
      interfaceType: efa-only
      networkCardIndex: 11
    - deviceIndex: 1
      interfaceType: efa-only
      networkCardIndex: 12
    - deviceIndex: 1
      interfaceType: efa-only
