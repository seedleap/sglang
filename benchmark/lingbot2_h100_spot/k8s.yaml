---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: codex-lingbot2-h100-perf
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-h100-perf
spec:
  disruption:
    consolidateAfter: 10m
    consolidationPolicy: WhenEmpty
    budgets:
      - nodes: "0"
        reasons: [Empty, Underutilized]
  limits:
    cpu: "192"
    nvidia.com/gpu: "8"
  template:
    metadata:
      labels:
        seedleap.ai/capacity-pool: codex-lingbot2-h100-perf
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: lingbot2-h100-perf
    spec:
      expireAfter: 8h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: codex-lingbot2-h100-perf-ec2
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [p5.48xlarge]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-2a, us-east-2b, us-east-2c]
---
apiVersion: v1
kind: Service
metadata:
  name: codex-lingbot2-h100-perf
  namespace: default
  labels:
    app: codex-lingbot2-h100-perf
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-h100-perf
spec:
  type: ClusterIP
  selector:
    app: codex-lingbot2-h100-perf
  ports:
    - name: api
      port: 30000
      targetPort: api
    - name: webui
      port: 18080
      targetPort: webui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-lingbot2-h100-perf-gateway-nginx
  namespace: default
  labels:
    app: codex-lingbot2-h100-perf-gateway
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-h100-perf
data:
  nginx.conf: |
    user nginx;
    worker_processes 2;
    error_log /var/log/nginx/error.log notice;
    pid /var/run/nginx.pid;

    events {
      worker_connections 2048;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      access_log /var/log/nginx/access.log;
      include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 8080;
      server_name _;
      client_max_body_size 64m;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location ^~ /v1/ {
        proxy_pass http://codex-lingbot2-h100-perf.default.svc.cluster.local:30000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
      }

      location / {
        proxy_pass http://codex-lingbot2-h100-perf.default.svc.cluster.local:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html application/javascript;
        sub_filter_once off;
        sub_filter 'ws://127.0.0.1:30000/v1/realtime_video/generate' 'ws://$http_host/v1/realtime_video/generate';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-lingbot2-h100-perf-gateway
  namespace: default
  labels:
    app: codex-lingbot2-h100-perf-gateway
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-h100-perf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codex-lingbot2-h100-perf-gateway
  template:
    metadata:
      labels:
        app: codex-lingbot2-h100-perf-gateway
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: lingbot2-h100-perf
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: codex-lingbot2-h100-perf-gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: codex-lingbot2-h100-perf-public
  namespace: default
  labels:
    app: codex-lingbot2-h100-perf-gateway
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-h100-perf
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: codex-lingbot2-h100-perf-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: api
      port: 30000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-lingbot2-h100-perf
  namespace: default
  labels:
    app: codex-lingbot2-h100-perf
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-h100-perf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codex-lingbot2-h100-perf
  template:
    metadata:
      labels:
        app: codex-lingbot2-h100-perf
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: lingbot2-h100-perf
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: "false"
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: "false"
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        seedleap.ai/code-git-branch: codex/lingbot-action-override
        seedleap.ai/code-git-ref: 644634498dfb0cdf59f3db023a908b8610f1bf26
        seedleap.ai/code-git-repo: lkejun237-ops/sglang
        seedleap.ai/attention-backend-config: lingbot_causal_fa_num_splits=2
        seedleap.ai/model-revision: 59cccf49f2d2dd27418ae7a04b82b10868d455c2
        seedleap.ai/runtime-image-ref: lmsysorg/sglang:dev@sha256:8f78575e03ab59a39191a4a6f718bbbe1726fa940f72a86a187a3f1628ada9a7
        seedleap.ai/taehv: enabled
        seedleap.ai/taehv-checkpoint-path: /opt/taehv/taew2_1.pth
    spec:
      nodeSelector:
        karpenter.sh/nodepool: codex-lingbot2-h100-perf
        node.kubernetes.io/instance-type: p5.48xlarge
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: lmsysorg/sglang:dev@sha256:8f78575e03ab59a39191a4a6f718bbbe1726fa940f72a86a187a3f1628ada9a7
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          securityContext:
            capabilities:
              add: [SYS_ADMIN]
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              rm -rf /workspace/sglang /tmp/git-askpass
              cat >/tmp/git-askpass <<'EOF'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s\n' x-access-token ;;
                *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
                *) printf '\n' ;;
              esac
              EOF
              chmod 700 /tmp/git-askpass
              GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 \
                git clone --filter=blob:none --branch "${CODE_GIT_BRANCH}" "https://github.com/${CODE_GIT_REPO}.git" /workspace/sglang
              rm -f /tmp/git-askpass
              cd /workspace/sglang
              git checkout "${CODE_GIT_REF}"
              test "$(git rev-parse HEAD)" = "${CODE_GIT_REF}"
              python3 -m pip install -e "python[diffusion]" --root-user-action=ignore
              python3 -m pip install \
                --force-reinstall \
                --no-deps \
                --index-url https://flashinfer.ai/whl/cu130 \
                'flashinfer-jit-cache==0.6.12+cu130'
              python3 -m pip install --no-cache-dir --no-deps \
                'taehv @ git+https://github.com/madebyollin/taehv.git@093b918971d59001a0bad6dfd6e0409b5e1752cf' \
                --root-user-action=ignore
              mkdir -p /opt/taehv
              python3 - <<'TAEHV_PY'
              import hashlib
              import urllib.request
              from pathlib import Path

              url = "https://raw.githubusercontent.com/madebyollin/taehv/093b918971d59001a0bad6dfd6e0409b5e1752cf/taew2_1.pth"
              target = Path("/opt/taehv/taew2_1.pth")
              urllib.request.urlretrieve(url, target)
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              expected = "d26151e76cdc2c9424bef988de874b33d9a53f30ef3060cd556c429c469c797e"
              if digest != expected:
                  raise SystemExit(f"TAEHV checkpoint sha256 mismatch: {digest}")
              TAEHV_PY
              python3 - <<'TAEHV_IMPORT_PY'
              from taehv import StreamingTAEHV, TAEHV
              print("TAEHV runtime ready")
              TAEHV_IMPORT_PY
              python3 -m http.server 18080 -d python/sglang/multimodal_gen/apps/realtime_webui >/tmp/lingbot-webui.log 2>&1 &
              webui_pid=$!
              serve_cmd=(sglang serve \
                --model-path "${MODEL_ID}" \
                --revision "${MODEL_REVISION}" \
                --pipeline-class-name LingBotWorldCausalDMDPipeline \
                --num-gpus "${NUM_GPUS}" \
                --performance-mode "${PERFORMANCE_MODE}" \
                --tp-size "${TP_SIZE}" \
                --sp-degree "${ULYSSES_DEGREE}" \
                --ulysses-degree "${ULYSSES_DEGREE}" \
                --dit-cpu-offload false \
                --text-encoder-cpu-offload false \
                --vae-config.use-parallel-decode true \
                --vae-config.parallel-decode-mode spatial \
                --vae-config.taehv-checkpoint-path "${TAEHV_CHECKPOINT_PATH}" \
                --enable-torch-compile "${ENABLE_TORCH_COMPILE}" \
                --enable-layerwise-nvtx-marker "${ENABLE_NSYS_PROFILE}" \
                --host 0.0.0.0 \
                --port 30000)
              if [[ -n "${ATTENTION_BACKEND_CONFIG}" ]]; then
                serve_cmd+=(--attention-backend-config "${ATTENTION_BACKEND_CONFIG}")
              fi
              if [[ "${ENABLE_NSYS_PROFILE}" == "true" ]]; then
                nsys profile \
                  --trace=cuda,nvtx,nccl \
                  --sample=none \
                  --cpuctxsw=none \
                  --capture-range=nvtx \
                  --nvtx-capture="${NSYS_NVTX_CAPTURE}" \
                  --capture-range-end=stop \
                  --force-overwrite=true \
                  --output="${NSYS_OUTPUT_PATH}" \
                  "${serve_cmd[@]}" &
              else
                "${serve_cmd[@]}" &
              fi
              server_pid=$!
              trap 'kill -TERM "${server_pid}" "${webui_pid}" 2>/dev/null || true' TERM INT
              wait "${server_pid}"
              status=$?
              kill -TERM "${webui_pid}" 2>/dev/null || true
              exit "${status}"
          env:
            - name: CODE_GIT_REF
              value: 644634498dfb0cdf59f3db023a908b8610f1bf26
            - name: CODE_GIT_BRANCH
              value: codex/lingbot-action-override
            - name: CODE_GIT_REPO
              value: lkejun237-ops/sglang
            - name: MODEL_ID
              value: robbyant/lingbot-world-v2-14b-causal-fast-diffusers
            - name: MODEL_REVISION
              value: 59cccf49f2d2dd27418ae7a04b82b10868d455c2
            - name: NUM_GPUS
              value: "8"
            - name: PERFORMANCE_MODE
              value: speed
            - name: TP_SIZE
              value: "1"
            - name: ULYSSES_DEGREE
              value: "8"
            - name: ENABLE_TORCH_COMPILE
              value: "false"
            - name: ENABLE_NSYS_PROFILE
              value: "false"
            - name: ATTENTION_BACKEND_CONFIG
              value: lingbot_causal_fa_num_splits=2
            - name: TAEHV_CHECKPOINT_PATH
              value: /opt/taehv/taew2_1.pth
            - name: NSYS_NVTX_CAPTURE
              value: stage_LingBotWorldCausalDMDDenoisingStage
            - name: NSYS_OUTPUT_PATH
              value: /results/e2-baseline-dit
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: SGLANG_LINGBOT_LAZY_VAE_ENCODE_BLACK_FRAMES
              value: "60"
            - name: SGLANG_LINGBOT_ENABLE_INTERACTIVE_KV_WINDOW
              value: "true"
            - name: SGLANG_DIFFUSION_CACHE_ROOT
              value: /results/sgl-diffusion-cache
            - name: SGLANG_DIFFUSION_STAGE_LOGGING
              value: "true"
            - name: SGLANG_REALTIME_TRACE_SYNC_CUDA
              value: "1"
            - name: SGLANG_DIFFUSION_BENCHMARK_BYPASS_USP_A2A
              value: "false"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
            - name: NCCL_PROTO
              value: Simple
          ports:
            - name: api
              containerPort: 30000
            - name: webui
              containerPort: 18080
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /v1/models
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "64"
              memory: 512Gi
              ephemeral-storage: 160Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "192"
              memory: 1Ti
              ephemeral-storage: 350Gi
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: pip-cache
              mountPath: /root/.cache/pip
            - name: results
              mountPath: /results
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: hf-cache
          hostPath:
            path: /var/lib/codex-lingbot2-h100-perf/hf-cache
            type: DirectoryOrCreate
        - name: pip-cache
          hostPath:
            path: /var/lib/codex-lingbot2-h100-perf/pip-cache
            type: DirectoryOrCreate
        - name: results
          hostPath:
            path: /var/lib/codex-lingbot2-h100-perf/results
            type: DirectoryOrCreate
