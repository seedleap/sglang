  amiSelectorTerms:
    - id: ami-0cba08f75775ef406
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        volumeSize: 400Gi
        volumeType: gp3
  role: KarpenterNodeRole-leap-world
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: leap-world
  subnetSelectorTerms:
    - id: subnet-0b3e75dab2f514ab3
    - id: subnet-0245e620ed4f40137
    - id: subnet-0bcfc20f6b0e5f29c
  networkInterfaces:
    - deviceIndex: 0
      interfaceType: interface
      networkCardIndex: 0
    - deviceIndex: 1
      interfaceType: efa-only
      networkCardIndex: 1
