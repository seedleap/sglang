apiVersion: v1
kind: Namespace
metadata:
  name: minwm-zing-webrtc-lab
  labels:
    app.kubernetes.io/name: minwm-zing-webrtc-lab
    seedleap.ai/environment: development
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: zing-webrtc-h100-nvme
  labels:
    app.kubernetes.io/part-of: minwm-zing-webrtc-lab
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - name: amazon-eks-node-al2023-x86_64-nvidia-*
      owner: amazon
  # p5.48xlarge exposes 8 x 3.8 TB NVMe instance-store disks. Karpenter
  # assembles them as RAID0 and places kubelet/containerd on that filesystem,
  # so pod emptyDir volumes (including /model-cache) never use the GP3 root.
  instanceStorePolicy: RAID0
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        deleteOnTermination: true
        encrypted: true
        volumeSize: 400Gi
        volumeType: gp3
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  networkInterfaces:
    - {deviceIndex: 0, interfaceType: interface, networkCardIndex: 0}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 1}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 2}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 3}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 4}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 5}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 6}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 7}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 8}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 9}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 10}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 11}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 12}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 13}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 14}
    - {deviceIndex: 1, interfaceType: efa-only, networkCardIndex: 15}
  role: KarpenterNodeRole-leap-world
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: leap-world
  subnetSelectorTerms:
    - id: subnet-0b3e75dab2f514ab3
    - id: subnet-0bcfc20f6b0e5f29c
    - id: subnet-0245e620ed4f40137
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: zing-webrtc-h100
  labels:
    app.kubernetes.io/part-of: minwm-zing-webrtc-lab
spec:
  limits:
    cpu: "192"
    nvidia.com/gpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 2m
  template:
    metadata:
      labels:
        seedleap.ai/zing-webrtc-role: denoiser
        seedleap.ai/environment: development
        seedleap.ai/model-cache: nvme-raid0
    spec:
      expireAfter: Never
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: zing-webrtc-h100-nvme
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-2a, us-east-2b, us-east-2c]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [p5.48xlarge]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: zing-webrtc-l4-isolated
  labels:
    app.kubernetes.io/part-of: minwm-zing-webrtc-lab
spec:
  limits:
    cpu: "8"
    nvidia.com/gpu: "1"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 2m
  template:
    metadata:
      labels:
        seedleap.ai/zing-webrtc-role: vae
        seedleap.ai/environment: development
    spec:
      expireAfter: Never
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ray-gpu-ec2-all
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-2a, us-east-2b, us-east-2c]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [g6.2xlarge]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
        - key: seedleap.ai/zing-webrtc-l4
          value: isolated
          effect: NoSchedule
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: zing-webrtc-cpu
  labels:
    app.kubernetes.io/part-of: minwm-zing-webrtc-lab
spec:
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 2m
  template:
    metadata:
      labels:
        seedleap.ai/zing-webrtc-role: control-media
        seedleap.ai/environment: development
    spec:
      expireAfter: 168h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: platform-ec2-all
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-2a, us-east-2b, us-east-2c]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [c7a.4xlarge, m7a.4xlarge, m6a.4xlarge]
      taints:
        - key: seedleap.ai/zing-webrtc-cpu
          value: "true"
          effect: NoSchedule
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zing-webrtc-model-pv
  labels:
    app.kubernetes.io/part-of: minwm-zing-webrtc-lab
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  csi:
    driver: s3.csi.aws.com
    volumeHandle: zing-webrtc-model-us-east-2-20260814
    volumeAttributes:
      bucketName: leap-world-model-serving-829115578968-us-east-2
      mount-timeout-seconds: "300"
  mountOptions:
    - region us-east-2
    - --read-part-size 25165824
    - --maximum-throughput-gbps 100
    - --metadata-ttl 3600
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zing-webrtc-model
  namespace: minwm-zing-webrtc-lab
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: zing-webrtc-model-pv
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zing-webrtc-worker-discovery
  namespace: minwm-zing-webrtc-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zing-webrtc-worker-discovery
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zing-webrtc-worker-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zing-webrtc-worker-discovery
subjects:
  - kind: ServiceAccount
    name: zing-webrtc-worker-discovery
    namespace: minwm-zing-webrtc-lab
