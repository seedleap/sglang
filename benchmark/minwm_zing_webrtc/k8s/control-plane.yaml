apiVersion: v1
kind: Service
metadata:
  name: zing-webrtc-coordinator
  namespace: minwm-zing-webrtc-lab
spec:
  selector:
    app.kubernetes.io/name: zing-webrtc-coordinator
  ports:
    - {name: http, port: 18081, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zing-webrtc-coordinator
  namespace: minwm-zing-webrtc-lab
  labels:
    app.kubernetes.io/name: zing-webrtc-coordinator
    app.kubernetes.io/part-of: minwm-zing-webrtc-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zing-webrtc-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zing-webrtc-coordinator
        app.kubernetes.io/part-of: minwm-zing-webrtc-lab
    spec:
      nodeSelector:
        karpenter.sh/nodepool: zing-webrtc-cpu
      tolerations:
        - {key: seedleap.ai/zing-webrtc-cpu, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: coordinator
          image: REPLACE_WITH_CPU_IMAGE
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python -m sglang.multimodal_gen.runtime.entrypoints.realtime_coordinator_server
              --host=0.0.0.0
              --port=18081
              --backend=memory
              --ttl-s=30
              --worker-ttl-s=15
              --wait-timeout-s=15
              --candidate-limit=16
          ports:
            - {name: http, containerPort: 18081}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: zing-webrtc-gateway
  namespace: minwm-zing-webrtc-lab
spec:
  selector:
    app.kubernetes.io/name: zing-webrtc-gateway
  ports:
    - {name: http, port: 18080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zing-webrtc-gateway
  namespace: minwm-zing-webrtc-lab
  labels:
    app.kubernetes.io/name: zing-webrtc-gateway
    app.kubernetes.io/part-of: minwm-zing-webrtc-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zing-webrtc-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zing-webrtc-gateway
        app.kubernetes.io/part-of: minwm-zing-webrtc-lab
    spec:
      nodeSelector:
        karpenter.sh/nodepool: zing-webrtc-cpu
      tolerations:
        - {key: seedleap.ai/zing-webrtc-cpu, operator: Equal, value: "true", effect: NoSchedule}
      containers:
        - name: gateway
          image: REPLACE_WITH_CPU_IMAGE
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python -m sglang.multimodal_gen.runtime.entrypoints.realtime_gateway_server
              --host=0.0.0.0
              --port=18080
              --coordinator-url=http://zing-webrtc-coordinator:18081
              --model-revision=${MODEL_REVISION}
              --vae-fingerprint=${VAE_FINGERPRINT}
              --internal-output-url=ws://${POD_IP}:18080/v1/internal/realtime_output
              --output-queue-depth=128
              --output-enqueue-timeout-s=0
              --output-drain-timeout-s=120
              --lease-renew-interval-s=10
              --release-grace-s=0.5
              --max-admission-waiters=64
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: MODEL_REVISION, value: zing-gs3200-20260810}
            - {name: VAE_FINGERPRINT, value: taew2_2-d053e216}
            - name: REALTIME_UI_CONFIG_JSON
              value: '{"generationModes":["i2v","t2v"],"defaultGenerationMode":"i2v","modelSlotCount":1,"singleExperience":true,"sessionMaxLifetimeSeconds":600,"dualModels":{"minwm":{"label":"Zing","targetFps":16,"sinkSize":8}}}'
          ports:
            - {name: http, containerPort: 18080}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
