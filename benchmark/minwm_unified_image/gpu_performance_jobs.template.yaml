apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-perf-h200-__SOURCE_SHA12__-__IMAGE_DIGEST12__
  namespace: default
  labels:
    app.kubernetes.io/name: minwm-image-performance-gate
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-image-performance-gate
    seedleap.ai/gpu-family: hopper
  annotations:
    seedleap.ai/source-commit: "__SOURCE_SHA40__"
    seedleap.ai/requested-image-digest: "__IMAGE_DIGEST__"
    seedleap.ai/checkpoint-version-id: "9lr1pX__59kUFlsv6Q.NKFQO3EoRQY9C"
    seedleap.ai/performance-contract: "packed-fast-bf16-1248x704-kv45-w20-m100"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-image-performance-gate
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: minwm-image-performance-gate
        seedleap.ai/gpu-family: hopper
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        karpenter.sh/capacity-type: spot
        karpenter.sh/nodepool: minwm-test-phx2-p5e-spot
        node.kubernetes.io/instance-type: p5e.48xlarge
        topology.kubernetes.io/zone: us-west-2-phx-2a
      tolerations:
        - key: seedleap.ai/capacity-pool
          operator: Equal
          value: minwm-test-phx2-karpenter
          effect: NoSchedule
      containers:
        - name: performance-gate
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-runtime@__IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          workingDir: /sgl-workspace/sglang
          command: ["/bin/bash", "-lc"]
          args:
            - exec bash benchmark/minwm_unified_image/run_720p_performance_gate.sh
          env:
            - name: EXPECTED_SOURCE_COMMIT
              value: "__SOURCE_SHA40__"
            - name: EXPECTED_IMAGE_DIGEST
              value: "__IMAGE_DIGEST__"
            - name: MINWM_GPU_FAMILY
              value: hopper
            # Reserve all GPUs, but expose only cuda:0 to the process. This
            # preserves the accepted single-card contract and prevents GPU
            # co-tenancy; CPU-only co-tenants are audited from the Pod/Node
            # evidence after scheduling.
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_DATASETS_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: DIFFUSERS_OFFLINE
              value: "1"
            - name: WANDB_MODE
              value: disabled
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "32"
              memory: 200Gi
              ephemeral-storage: 80Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "64"
              memory: 400Gi
              ephemeral-storage: 140Gi
              nvidia.com/gpu: "8"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: work
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
            readOnly: true
        - name: work
          emptyDir:
            sizeLimit: 140Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
---
