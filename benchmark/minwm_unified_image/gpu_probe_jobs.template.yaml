apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-image-gate-h200-__SOURCE_SHA12__-__IMAGE_DIGEST12__
  namespace: default
  labels:
    app.kubernetes.io/name: minwm-image-release-gate
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-image-release-gate
    seedleap.ai/gpu-family: hopper
  annotations:
    seedleap.ai/source-commit: "__SOURCE_SHA40__"
    seedleap.ai/requested-image-digest: "__IMAGE_DIGEST__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-image-release-gate
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: minwm-image-release-gate
        seedleap.ai/gpu-family: hopper
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        karpenter.sh/capacity-type: spot
        karpenter.sh/nodepool: minwm-test-phx2-p5e-spot
        node.kubernetes.io/instance-type: p5e.48xlarge
        topology.kubernetes.io/zone: us-west-2-phx-2a
      tolerations:
        - key: seedleap.ai/capacity-pool
          operator: Equal
          value: minwm-test-phx2-karpenter
          effect: NoSchedule
      containers:
        - name: probe
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-runtime@__IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          workingDir: /sgl-workspace/sglang
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              exec python3 -m sglang.multimodal_gen.tools.minwm_image_runtime_probe \
                --expected-source-commit "${EXPECTED_SOURCE_COMMIT}" \
                --expected-family hopper \
                --expected-visible-gpus 1 \
                --expected-image-digest "${EXPECTED_IMAGE_DIGEST}"
          env:
            - name: EXPECTED_SOURCE_COMMIT
              value: "__SOURCE_SHA40__"
            - name: EXPECTED_IMAGE_DIGEST
              value: "__IMAGE_DIGEST__"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_DATASETS_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: DIFFUSERS_OFFLINE
              value: "1"
            - name: WANDB_MODE
              value: disabled
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
