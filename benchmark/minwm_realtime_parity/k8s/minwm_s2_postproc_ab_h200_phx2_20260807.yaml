          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              [[ "${SGLANG_GIT_REF}" != REPLACE_* ]]
              export MINWM_RESULTS_ROOT="/results/attempts/${HOSTNAME}"
              mkdir -p "${MINWM_RESULTS_ROOT}"
              record_exit() {
                local task_status=$? existing_invalid_marker
                {
                  echo "exit_status=${task_status}"
                  echo "finished_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
                  df -h /work /results || true
                  nvidia-smi || true
                } > "${MINWM_RESULTS_ROOT}/pod-exit-diagnostic.txt"
                existing_invalid_marker="$(find "${MINWM_RESULTS_ROOT}" -type f \
                  \( -name 'invalid-marker-*.json' -o -path '*/invalid/*.json' \) \
                  -print -quit)"
                if (( task_status != 0 )) && [[ -z "${existing_invalid_marker}" ]]; then
                  mkdir -p "${MINWM_RESULTS_ROOT}/invalid"
                  python3 - "${MINWM_RESULTS_ROOT}" "${task_status}" <<'PY' || true
              import hashlib
              import json
              import sys
              from datetime import datetime, timezone
              from pathlib import Path

              root = Path(sys.argv[1])
              status = int(sys.argv[2])
              marker = root / "invalid" / "attempt.json"
              base = {
                  "schema_version": "minwm-invalid-attempt/v1",
                  "reason": f"container exited nonzero ({status}); acceptance/script failure or interruption",
                  "exit_status": status,
                  "invalidated_utc": datetime.now(timezone.utc).isoformat(),
                  "attempt_root": str(root),
                  "physically_deleted": False,
                  "recoverability": (
                      "all artifacts remain in place on the task PVC; mount the PVC in a "
                      "reader Pod to recover them"
                  ),
                  "inventory_status": "hashing",
                  "artifacts": [],
              }
              marker.write_text(json.dumps(base, indent=2, sort_keys=True) + "\n")

              artifacts = []
              inventory_complete = True
              for artifact in sorted(root.rglob("*")):
                  if not artifact.is_file() or marker.parent in artifact.parents:
                      continue
                  record = {
                      "path": str(artifact.relative_to(root)),
                      "size_bytes": artifact.stat().st_size,
                  }
                  try:
                      digest = hashlib.sha256()
                      with artifact.open("rb") as source:
                          for chunk in iter(lambda: source.read(8 * 1024 * 1024), b""):
                              digest.update(chunk)
                      record["sha256"] = digest.hexdigest()
                  except OSError as error:
                      inventory_complete = False
                      record["sha256"] = None
                      record["error"] = repr(error)
                  artifacts.append(record)

              base["inventory_status"] = "complete" if inventory_complete else "partial"
              base["artifacts"] = artifacts
              temporary = marker.with_suffix(".json.tmp")
              temporary.write_text(json.dumps(base, indent=2, sort_keys=True) + "\n")
              temporary.replace(marker)
              PY
                fi
              }
              trap record_exit EXIT
              {
                echo "kube_context=codex-minwm-test-phx2"
                echo "region=us-west-2"
                echo "nodepool=minwm-test-phx2-p5e-spot"
                echo "pod=${HOSTNAME}"
                echo "backoff_limit=0"
                echo "started_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
              } | tee "${MINWM_RESULTS_ROOT}/cluster-contract.txt"
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"
              clone_at sglang /workspace/sglang "${SGLANG_GIT_REF}"
              git -C /workspace/sglang rev-parse HEAD \
                | tee "${MINWM_RESULTS_ROOT}/sglang-commit.txt"
              bash /workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh
              bash /workspace/sglang/benchmark/minwm_realtime_parity/run_s2_postproc_ab_h200.sh
