            requests:
              cpu: "64"
              memory: 400Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "128"
              memory: 800Gi
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: work
              mountPath: /work
            - name: results
              mountPath: /results
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
        - name: work
          emptyDir: {}
        - name: results
          persistentVolumeClaim:
            claimName: minwm-s2-postproc-ab-h200-results-20260807
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Gi
