            - name: MINWM_CONTAINER_IMAGE
              value: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-training@sha256:bedc07ea3ba55059a8c1c569c3b177c4d00d41f37d4fa9105375531534ef5f2a
            - name: MINWM_BENCHMARK_MODE
              value: setup_only
