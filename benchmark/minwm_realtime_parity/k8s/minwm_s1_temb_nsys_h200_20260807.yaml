              value: /workspace/sglang
            - name: MINWM_RESULTS_ROOT
              value: /results/attempts
          command:
            - /bin/bash
            - -lc
            - |
              set -Eeuo pipefail
              export MINWM_RESULTS_ROOT="/results/attempts/${HOSTNAME}"
              ATTEMPT_ROOT="${MINWM_RESULTS_ROOT}/${MINWM_RUN_ID}"
              RUNNER_DIR=/work/s1-runner/minwm_realtime_parity
              WRAPPER_STARTED=0
              mkdir -p "${ATTEMPT_ROOT}"
              record_exit() {
                local status=$?
                trap - EXIT
                {
                  echo "exit_status=${status}"
                  echo "finished_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
                  df -h /work /results || true
                  nvidia-smi || true
                } > "${MINWM_RESULTS_ROOT}/pod-exit-diagnostic.txt"
                if (( status != 0 && WRAPPER_STARTED == 0 )) \
                  && [[ -f "${RUNNER_DIR}/measurement_tool.py" ]] \
                  && ! compgen -G "${ATTEMPT_ROOT}/invalid-marker*.json" >/dev/null; then
                  local timestamp
                  timestamp="$(date --utc +%Y%m%dT%H%M%S%NZ)"
                  python3 "${RUNNER_DIR}/measurement_tool.py" mark-invalid \
                    --root "${ATTEMPT_ROOT}" \
                    --reason "S1 Nsight global setup/preflight failed (status=${status})" \
                    --marker "${ATTEMPT_ROOT}/invalid-marker-${timestamp}.json" || true
                fi
                exit "${status}"
              }
              trap record_exit EXIT
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }
              clone_at sglang /workspace/sglang "${S1_RUNNER_REF}"
              mkdir -p /work/s1-runner
              cp -a \
                /workspace/sglang/benchmark/minwm_realtime_parity \
                /work/s1-runner/minwm_realtime_parity
              git -C /workspace/sglang merge-base --is-ancestor \
                "${MINWM_S0_TOOL_REF}" "${S1_RUNNER_REF}"
              git -C /workspace/sglang merge-base --is-ancestor \
                "${MINWM_S0_TOOL_REF}" "${SGLANG_GIT_REF}"
              while IFS= read -r model_path; do
                case "${model_path}" in
                  benchmark/minwm_realtime_parity/TIMESTEP_MODULATION_HOIST.zh-CN.md|\
                  python/sglang/multimodal_gen/runtime/models/dits/causal_wanvideo.py|\
                  python/sglang/multimodal_gen/runtime/models/dits/minwm.py|\
                  python/sglang/multimodal_gen/test/unit/realtime/test_minwm_realtime.py)
                    ;;
                  *)
                    echo "unexpected model measurement diff: ${model_path}" >&2
                    exit 2
                    ;;
                esac
              done < <(git -C /workspace/sglang diff --name-only \
                "${MINWM_S0_TOOL_REF}..${SGLANG_GIT_REF}")
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"
              git -C /workspace/sglang checkout --detach "${SGLANG_GIT_REF}"
              [[ "$(git -C /workspace/sglang rev-parse HEAD)" == "${SGLANG_GIT_REF}" ]]
              if pgrep -x nsys >/dev/null; then
                echo "S1 Nsight setup refuses a pre-existing nsys process" >&2
                pgrep -a -x nsys >&2 || true
                exit 2
              fi
              {
                echo "sglang_commit=$(git -C /workspace/sglang rev-parse HEAD)"
                echo "s1_runner_ref=${S1_RUNNER_REF}"
                echo "s0_tool_ref=${MINWM_S0_TOOL_REF}"
                echo "minwm_commit=${MINWM_GIT_REF}"
                echo "kube_context=codex-minwm-test-phx2"
                echo "aws_region=us-west-2"
                echo "nodepool=minwm-test-phx2-p5e-spot"
                echo "node_name=${K8S_NODE_NAME}"
                echo "instance_type=p5e.48xlarge"
                echo "active_gpu_count=2"
                echo "allocated_gpu_count=8"
                echo "kv_cache_num_frames=45"
                echo "measurement_plan=sp2-nsys-only-legacy-then-candidate-exact-10"
                echo "legacy_off_root=${MINWM_S1_LEGACY_OFF_ROOT}"
                echo "candidate_off_root=${MINWM_S1_CANDIDATE_OFF_ROOT}"
                echo "profiler_off_sglang_ref=${MINWM_S1_PROFILER_OFF_GIT_REF}"
                echo "legacy_off_runner_ref=${MINWM_S1_LEGACY_OFF_RUNNER_REF}"
                echo "candidate_off_runner_ref=${MINWM_S1_CANDIDATE_OFF_RUNNER_REF}"
              } | tee "${ATTEMPT_ROOT}/provenance.txt"
              bash /workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh
              # setup_only installs runtime dependencies. Run every Python import
              # and source-registration preflight after setup, before test/server/client.
              export PYTHONPATH="/workspace/sglang/python${PYTHONPATH:+:${PYTHONPATH}}"
              python3 -c 'import sglang.test.ci.ci_register'
              python3 - "${RUNNER_DIR}" <<'PY'
              import sys
              from pathlib import Path

              script_dir = Path(sys.argv[1])
              required_by_file = {
                  "run_s0_measurement.sh": (
                      "--gpu-metrics-devices=all",
                      "--require-complete-stable-nsys",
                      'SGLANG_REALTIME_NSYS_WARMUP_CHUNKS="${PROFILE_DISCARD_CHUNKS}"',
                      'SGLANG_REALTIME_NSYS_MEASURED_CHUNKS="${PROFILE_MEASURED_CHUNKS}"',
                  ),
                  "measurement.py": (
                      "API_BOUNDARY_ATTRIBUTION_POLICY",
                      "boundary_included_by_start_count",
                      "aggregation_mode",
                  ),
                  "nsys_metrics.py": (
                      "_discrete_event_start_attribution",
                      "boundary_event_examples",
                      "streaming selected metricId rows",
                  ),
              }
              for name, required in required_by_file.items():
                  contents = (script_dir / name).read_text()
                  for text in required:
                      if text not in contents:
                          raise SystemExit(
                              f"canonical Nsight guard missing from {name}: {text}"
                          )
              PY
              WRAPPER_STARTED=1
              bash "${RUNNER_DIR}/run_temb_hoist_nsys_ab.sh"
          resources:
            requests:
              cpu: "64"
              memory: 400Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "128"
              memory: 800Gi
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: work
              mountPath: /work
            - name: results
              mountPath: /results
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
        - name: work
          emptyDir: {}
        - name: results
          persistentVolumeClaim:
            claimName: minwm-s1-temb-ab-h200-results-20260807
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Gi
