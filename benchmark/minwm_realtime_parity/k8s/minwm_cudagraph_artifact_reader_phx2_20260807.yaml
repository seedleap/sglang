apiVersion: v1
kind: Pod
metadata:
  name: minwm-cudagraph-artifact-reader-20260807-01
  namespace: default
  labels:
    app.kubernetes.io/name: minwm-cudagraph-artifact-reader-20260807-01
    seedleap.ai/owner: chenshengdong
    seedleap.ai/purpose: minwm-cuda-graph-correctness
    seedleap.ai/task: minwm-realtime-parity
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  securityContext:
    seLinuxOptions:
      type: spc_t
  nodeSelector:
    karpenter.sh/nodepool: minwm-test-phx2-p5e-spot
    topology.kubernetes.io/zone: us-west-2-phx-2a
  tolerations:
    - key: seedleap.ai/capacity-pool
      operator: Equal
      value: minwm-test-phx2-karpenter
      effect: NoSchedule
  containers:
    - name: reader
      image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-training@sha256:bedc07ea3ba55059a8c1c569c3b177c4d00d41f37d4fa9105375531534ef5f2a
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
        - |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/results")
          for path in sorted(root.glob("*/cuda-graph-matrix/summary.json")):
              run = path.parents[1].name
              try:
                  data = json.loads(path.read_text())
              except Exception as exc:
                  print(json.dumps({"run": run, "read_error": repr(exc)}))
                  continue
              row = {"run": run, "comparisons": data.get("comparisons", {})}
              print(json.dumps(row, sort_keys=True))
          PY
          echo VERIFICATION_LOGS
          find /results -path '*/cuda-graph-matrix/*/server.log' -type f -print0 \
            | sort -z \
            | xargs -0 grep -H -E \
              'CUDA graph block verification|CUDA graph first difference|CUDA graph eager verification|CUDA graph verification|Captured MinWM|CUDA graph replay' \
            || true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: results
          mountPath: /results
          readOnly: true
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: minwm-cudagraph-sp12-h200-results-20260807
        readOnly: true
