apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minwm-qkv-ncu-h200-results-20260814
  namespace: default
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/purpose: minwm-qkv-ncu-single-gpu
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: minwm-dmd-0724-p6-gp3
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-qkv-ncu-single-gpu-h200-20260814-04
  namespace: default
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/purpose: minwm-qkv-ncu-single-gpu
    seedleap.ai/task: minwm-fusedops-s4
  annotations:
    seedleap.ai/capacity-type: spot
    seedleap.ai/resource-isolation: reuse existing Spot node; request 4/8 H200; four independent single-GPU lanes; no distributed SP
    seedleap.ai/sglang-git-ref: "de30b59fb3d22d5a329041ce4f5afbbd8b9043da"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: seedleap.ai/capacity-pool
          operator: Equal
          value: minwm-test-phx2-karpenter
          effect: NoSchedule
      # Reuse the node already provisioned by the failed preflight instead of
      # asking Karpenter for another p5e.48xlarge.
      nodeName: i-0a29920a9951065c6
      containers:
        - name: ncu
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-training@sha256:bedc07ea3ba55059a8c1c569c3b177c4d00d41f37d4fa9105375531534ef5f2a
          securityContext:
            runAsUser: 0
            capabilities:
              add: [SYS_ADMIN]
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              run_dir="/results/attempts/${HOSTNAME}/minwm-qkv-ncu-single-gpu-h200-20260814-04"
              mkdir -p "$run_dir"
              record_exit() {
                local status=$?
                printf 'exit_status=%s\nfinished_utc=%s\n' "$status" "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" > "$run_dir/pod-exit-diagnostic.txt"
                nvidia-smi > "$run_dir/nvidia-smi.txt" || true
              }
              trap record_exit EXIT
              find /results/attempts -maxdepth 5 -type f -printf '%p\t%s bytes\n' | sort | tee "$run_dir/prior-pvc-files.txt"
              git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/sglang.git" /workspace/sglang
              git -C /workspace/sglang checkout --detach de30b59fb3d22d5a329041ce4f5afbbd8b9043da
              cd /workspace/sglang
              test "$(git rev-parse HEAD)" = de30b59fb3d22d5a329041ce4f5afbbd8b9043da
              export PYTHONPATH="$PWD/python"
              ncu_bin="$(command -v ncu || true)"
              if [[ -z "$ncu_bin" ]]; then
                ncu_bin="$(find /opt /usr/local -type f -name ncu -perm -111 2>/dev/null | head -n 1 || true)"
              fi
              if [[ -z "$ncu_bin" ]]; then
                echo "ncu unavailable in image" >&2
                exit 30
              fi
              "$ncu_bin" --version | tee "$run_dir/ncu-version.txt"
              nvidia-smi -q -d CLOCK,POWER,TEMPERATURE > "$run_dir/gpu-before.txt"
              profile_pair() {
                local gpu="$1" m="$2" order="$3" first="$4" second="$5"
                for mode in "$first" "$second"; do
                  lane="m${m}-gpu${gpu}-${mode}"
                  CUDA_VISIBLE_DEVICES="$gpu" "$ncu_bin" \
                    --target-processes all \
                    --profile-from-start off \
                    --replay-mode kernel \
                    --set full \
                    --force-overwrite \
                    --export "$run_dir/${lane}" \
                    python benchmark/minwm_realtime_parity/profile_minwm_qkv_ncu.py \
                      --mode "$mode" --m "$m" --order "$order" --profile \
                      --output "$run_dir/${lane}-timing.json" \
                    > "$run_dir/${lane}.stdout" 2> "$run_dir/${lane}.stderr"
                  "$ncu_bin" --import "$run_dir/${lane}.ncu-rep" --page raw --csv \
                    > "$run_dir/${lane}-raw.csv"
                done
              }
              profile_pair 0 429 baseline-first baseline fused & p0=$!
              profile_pair 1 429 fused-first fused baseline & p1=$!
              profile_pair 2 215 baseline-first baseline fused & p2=$!
              profile_pair 3 215 fused-first fused baseline & p3=$!
              status=0
              for pid in "$p0" "$p1" "$p2" "$p3"; do
                wait "$pid" || status=1
              done
              sha256sum "$run_dir"/* > "$run_dir/SHA256SUMS"
              exit "$status"
          resources:
            requests:
              cpu: "32"
              memory: 128Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "64"
              memory: 256Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: minwm-qkv-ncu-h200-results-20260814
