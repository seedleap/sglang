              memory: 800Gi
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: work
              mountPath: /work
            - name: results
              mountPath: /results
            - name: shm
              mountPath: /dev/shm
