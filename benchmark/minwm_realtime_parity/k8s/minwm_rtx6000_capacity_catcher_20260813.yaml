apiVersion: v1
kind: Pod
metadata:
  name: minwm-rtx6000-capacity-catcher-20260813
  namespace: ray
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-rtx6000-taehv-capacity-catcher
spec:
  activeDeadlineSeconds: 1800
  restartPolicy: Never
  nodeSelector:
    seedleap.ai/capacity-pool: minwm-rtx6000-bounded-8gpu-spot
    karpenter.sh/capacity-type: spot
  tolerations:
    - key: seedleap.ai/capacity-pool
      operator: Equal
      value: minwm-rtx6000-bounded-8gpu-spot
      effect: NoSchedule
  containers:
    - name: hold
      image: public.ecr.aws/docker/library/busybox:1.36
      command: [/bin/sh, -c, "while true; do sleep 30; done"]
      resources:
        requests: {cpu: "1", memory: 2Gi, nvidia.com/gpu: "1"}
        limits: {cpu: "1", memory: 2Gi, nvidia.com/gpu: "1"}
