apiVersion: batch/v1
kind: Job
metadata:
  name: minwm-taehv-memory-ab-20260813-01
  namespace: ray
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-taehv-memory-32g-audit
    seedleap.ai/run-id: minwm-taehv-memory-ab-20260813-01
  annotations:
    seedleap.ai/capacity-type: spot
    seedleap.ai/repo: seedleap/sglang
    seedleap.ai/sglang-git-ref: "__CANDIDATE_COMMIT__"
    seedleap.ai/baseline-git-ref: "72999207266e00f4524d5b9e54f2a89d33f0f96c"
    seedleap.ai/minwm-git-ref: "4220c8a2dc456b2d9c85ef6c0d9db7fb872d864c"
    seedleap.ai/physical-memory-gate: "not-applicable-rtx6000-96g"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 16200
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: minwm-taehv-memory-32g-audit
        seedleap.ai/run-id: minwm-taehv-memory-ab-20260813-01
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      securityContext:
        seLinuxOptions:
          type: spc_t
      nodeSelector:
        seedleap.ai/capacity-pool: minwm-quant-rtx6000-spot
        karpenter.sh/capacity-type: spot
        node.kubernetes.io/instance-type: g7e.4xlarge
      tolerations:
        - key: seedleap.ai/capacity-pool
          operator: Equal
          value: minwm-quant-rtx6000-spot
          effect: NoSchedule
      containers:
        - name: memory-ab
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-training@sha256:bedc07ea3ba55059a8c1c569c3b177c4d00d41f37d4fa9105375531534ef5f2a
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
            - name: SGLANG_GIT_REF
              value: "__CANDIDATE_COMMIT__"
            - name: TAEHV_BASELINE_GIT_REF
              value: "72999207266e00f4524d5b9e54f2a89d33f0f96c"
            - name: TAEHV_EXPERIMENT_MODE
              value: memory_ab
            - name: MINWM_REQUESTED_GPUS
              value: "1"
            - name: MINWM_GIT_REF
              value: "4220c8a2dc456b2d9c85ef6c0d9db7fb872d864c"
            - name: MINWM_ARCHIVE_S3_URI
              value: s3://leap-world-us-east-2/world-model/evals/minwm/realtime-vae/20260813/taehv-memory-32g-audit
            - name: MINWM_CHECKPOINT_S3_EAST
              value: s3://leap-world-us-east-2/world-model/evals/minwm/checkpoint-staging/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_CHECKPOINT_VERSION_EAST
              value: wduScksw2f3yPErnG9lBioOuE2AToyAP
            - name: MINWM_CHECKPOINT_SOURCE_URI
              value: s3://leap-world-us-west-2/world-model/minwm/checkpoints/run-archive/rolling/Wan21/Action2V/dmd/wan22-5B-stage3-dmd-8-0721-6a531f0e067/global_step_003200/ema_student/model.pt
            - name: MINWM_CHECKPOINT_SOURCE_VERSION
              value: x.2zYaRRNzyqngI7O_cYSrsK3NvgPKKt
            - name: MINWM_CHECKPOINT_SOURCE_ETAG
              value: 5c29d614972e06fd0df859abfd1d6f4d-191
            - name: MINWM_CHECKPOINT_BYTES
              value: "10007171771"
            - name: MINWM_CHECKPOINT_CRC64
              value: I0IQ+p0pREI=
            - name: MINWM_PRETRAINED_S3
              value: s3://leap-world-us-east-2/world-model/checkpoints/minWM/Wan2.2-TI2V-5B-from-diffusers
            - name: PIP_CACHE_DIR
              value: /work/minwm-pip-cache
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }

              clone_at sglang /workspace/sglang "${SGLANG_GIT_REF}"
              git -C /workspace/sglang worktree add --detach \
                /workspace/sglang-baseline "${TAEHV_BASELINE_GIT_REF}"
              [[ "$(git -C /workspace/sglang-baseline rev-parse HEAD)" == "${TAEHV_BASELINE_GIT_REF}" ]]
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"

              PYTHONPATH=/workspace/sglang/python python3 -m pytest -q \
                /workspace/sglang/python/sglang/multimodal_gen/test/unit/realtime/test_realtime_vae.py

              exec bash /workspace/sglang/benchmark/minwm_realtime_parity/run_rtx6000_taehv_crossover.sh
          resources:
            requests:
              cpu: "12"
              memory: 108Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "14"
              memory: 114Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: work
          hostPath:
            path: /var/lib/minwm-rtx6000-work
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
