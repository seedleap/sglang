apiVersion: v1
kind: Pod
metadata:
  name: minwm-s5-fusedops-artifact-reader-20260809-09
  namespace: default
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/purpose: minwm-s5-fusedops-artifact-readback
    seedleap.ai/task: minwm-fusedops-s5
spec:
  restartPolicy: Never
  nodeSelector:
    karpenter.sh/nodepool: minwm-test-phx2-p5e-spot
