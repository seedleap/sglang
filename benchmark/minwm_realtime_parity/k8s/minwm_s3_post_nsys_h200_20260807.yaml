              value: /results/attempts
          command:
            - /bin/bash
            - -lc
            - |
              set -Eeuo pipefail
              export MINWM_RESULTS_ROOT="/results/attempts/${HOSTNAME}"
              ATTEMPT_ROOT="${MINWM_RESULTS_ROOT}/${MINWM_RUN_ID}"
              WRAPPER_STARTED=0
              mkdir -p "${ATTEMPT_ROOT}"
              record_exit() {
                local status=$?
                trap - EXIT
                {
                  echo "exit_status=${status}"
                  echo "finished_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
                  df -h /work /results || true
                  nvidia-smi || true
                } > "${MINWM_RESULTS_ROOT}/pod-exit-diagnostic.txt"
                if (( status != 0 && WRAPPER_STARTED == 0 )) \
                  && [[ -f "/workspace/sglang/benchmark/minwm_realtime_parity/measurement_tool.py" ]] \
                  && ! compgen -G "${ATTEMPT_ROOT}/invalid-marker*.json" >/dev/null; then
                  local timestamp
                  timestamp="$(date --utc +%Y%m%dT%H%M%S%NZ)"
                  python3 /workspace/sglang/benchmark/minwm_realtime_parity/measurement_tool.py \
                    mark-invalid \
                    --root "${ATTEMPT_ROOT}" \
                    --reason "S3 Nsight global setup/preflight failed (status=${status})" \
                    --marker "${ATTEMPT_ROOT}/invalid-marker-${timestamp}.json" || true
                fi
                exit "${status}"
              }
              trap record_exit EXIT
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"
              clone_at sglang /workspace/sglang "${SGLANG_GIT_REF}"
              git -C /workspace/sglang merge-base --is-ancestor \
                "${MINWM_S0_TOOL_REF}" "${SGLANG_GIT_REF}"
              {
                echo "sglang_runner_commit=$(git -C /workspace/sglang rev-parse HEAD)"
                echo "s3_product_commit=${MINWM_S3_PRODUCT_GIT_REF}"
                echo "s3_off_runtime_commit=${MINWM_S3_OFF_RUNTIME_REF}"
                echo "s0_tool_commit=${MINWM_S0_TOOL_REF}"
                echo "minwm_commit=${MINWM_GIT_REF}"
                echo "kube_context=codex-minwm-test-phx2"
                echo "aws_region=us-west-2"
                echo "zone=us-west-2-phx-2a"
                echo "nodepool=minwm-test-phx2-p5e-spot"
                echo "hostname=${K8S_NODE_NAME}"
                echo "instance_type=p5e.48xlarge"
                echo "active_gpu_count=2-or-4-per-lane"
                echo "allocated_gpu_count=8"
                echo "kv_cache_num_frames=45"
                echo "measurement_plan=sp2-sp4-baseline-candidate-nsys-only-exact10"
                echo "profiler_off_root=${MINWM_S3_OFF_ROOT}"
              } | tee "${ATTEMPT_ROOT}/provenance.txt"
              bash /workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh
              export PYTHONPATH="/workspace/sglang/python${PYTHONPATH:+:${PYTHONPATH}}"
              python3 -c 'import sglang.test.ci.ci_register'
              python3 -m pytest -q \
                /workspace/sglang/benchmark/minwm_realtime_parity/test_measurement.py \
                /workspace/sglang/benchmark/minwm_realtime_parity/test_s3_post_nsys.py \
                /workspace/sglang/benchmark/minwm_realtime_parity/test_s3_post_nsys_runner.py \
                | tee "${ATTEMPT_ROOT}/runner-tests.log"
              WRAPPER_STARTED=1
              bash /workspace/sglang/benchmark/minwm_realtime_parity/run_s3_post_nsys_matrix.sh
          resources:
            requests:
              cpu: "64"
              memory: 400Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "128"
              memory: 800Gi
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: work
              mountPath: /work
            - name: results
              mountPath: /results
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
        - name: work
          emptyDir: {}
        - name: results
          persistentVolumeClaim:
            claimName: minwm-s3-a2a-h200-results-20260807-01
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Gi
