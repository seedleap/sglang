            - name: MINWM_RESULTS_ROOT
              value: /results/attempts
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              export MINWM_RESULTS_ROOT="/results/attempts/${HOSTNAME}"
              mkdir -p "${MINWM_RESULTS_ROOT}"
              record_exit() {
                local status=$?
                {
                  echo "exit_status=${status}"
                  echo "finished_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
                  df -h /work /results || true
                  nvidia-smi || true
                } > "${MINWM_RESULTS_ROOT}/pod-exit-diagnostic.txt"
              }
              trap record_exit EXIT
              clone_at() {
                local repository="$1" destination="$2" revision="$3"
                git clone --no-checkout \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/seedleap/${repository}.git" \
                  "${destination}"
                git -C "${destination}" checkout --detach "${revision}"
                [[ "$(git -C "${destination}" rev-parse HEAD)" == "${revision}" ]]
              }
              clone_at minWM /workspace/minWM "${MINWM_GIT_REF}"
              clone_at sglang /workspace/sglang "${SGLANG_GIT_REF}"
              git -C /workspace/sglang rev-parse HEAD \
                | tee "${MINWM_RESULTS_ROOT}/sglang-commit.txt"
              bash /workspace/sglang/benchmark/minwm_realtime_parity/aws_b200_entrypoint.sh
              bash /workspace/sglang/benchmark/minwm_realtime_parity/run_async_a2a_measurement.sh
          resources:
            requests:
              cpu: "48"
              memory: 300Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "96"
              memory: 600Gi
              nvidia.com/gpu: "2"
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: work
              mountPath: /work
            - name: results
              mountPath: /results
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: s3
          persistentVolumeClaim:
            claimName: s3-claim
        - name: work
          emptyDir: {}
        - name: results
          persistentVolumeClaim:
            claimName: minwm-async-a2a-perf-results-20260807
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Gi
