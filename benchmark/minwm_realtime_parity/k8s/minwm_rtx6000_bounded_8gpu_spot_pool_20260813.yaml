apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: minwm-rtx6000-bounded-8gpu-spot
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: minwm-rtx6000-bounded-matrix
spec:
  limits:
    nvidia.com/gpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    budgets:
      - nodes: "0"
  template:
    metadata:
      labels:
        seedleap.ai/capacity-pool: minwm-rtx6000-bounded-8gpu-spot
        seedleap.ai/task: minwm-rtx6000-bounded-matrix
    spec:
      expireAfter: 5h
      terminationGracePeriod: 120s
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ray-gpu-ec2-all
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [us-east-2a, us-east-2b, us-east-2c]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [g7e.4xlarge, g7e.8xlarge, g7e.12xlarge, g7e.24xlarge, g7e.48xlarge]
      taints:
        - key: seedleap.ai/capacity-pool
          value: minwm-rtx6000-bounded-8gpu-spot
          effect: NoSchedule
