apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-lingbot2-continuation
  namespace: default
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-tpv1000x5-continuation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-lingbot2-continuation
  namespace: default
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-tpv1000x5-continuation
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames:
      - codex-lingbot2-thirdperson1000x5-720p
      - codex-lingbot2-tpv1000x5-a05000-09999-720p
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["codex-lingbot2-tpv1000x5-a05000-09999-720p"]
    verbs: ["patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-lingbot2-continuation
  namespace: default
  labels:
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-tpv1000x5-continuation
subjects:
  - kind: ServiceAccount
    name: codex-lingbot2-continuation
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-lingbot2-continuation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: codex-lingbot2-continuation-controller
  namespace: default
  labels:
    app.kubernetes.io/name: codex-lingbot2-continuation-controller
    seedleap.ai/owner: chenshengdong
    seedleap.ai/task: lingbot2-tpv1000x5-continuation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 604800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-lingbot2-continuation-controller
        seedleap.ai/owner: chenshengdong
        seedleap.ai/task: lingbot2-tpv1000x5-continuation
    spec:
      serviceAccountName: codex-lingbot2-continuation
      restartPolicy: OnFailure
      containers:
        - name: controller
          image: public.ecr.aws/docker/library/python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/controller/continue_after_job.py]
          env:
            - name: SOURCE_JOB
              value: codex-lingbot2-thirdperson1000x5-720p
            - name: FOLLOWUP_JOB
              value: codex-lingbot2-tpv1000x5-a05000-09999-720p
            - name: SOURCE_DEADLINE
              value: "2026-07-15T22:50:34Z"
            - name: POLL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: controller
              mountPath: /opt/controller
              readOnly: true
      volumes:
        - name: controller
          configMap:
            name: codex-lingbot2-continuation-controller
            defaultMode: 0555
