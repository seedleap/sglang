apiVersion: v1
kind: Service
metadata:
  name: tianpeng-direct-async-denoiser-headless
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: tianpeng-direct-async-denoiser
    app.kubernetes.io/part-of: minwm-realtime
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: tianpeng-direct-async-denoiser
  ports:
    - {name: api, port: 30000, targetPort: api}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tianpeng-direct-async-denoiser
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: tianpeng-direct-async-denoiser
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: tianpeng-direct-async-denoiser-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: tianpeng-direct-async-denoiser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tianpeng-direct-async-denoiser
        app.kubernetes.io/part-of: minwm-realtime
        seedleap.ai/test-run: minwm-async-vae-benchmark
    spec:
      serviceAccountName: minwm-realtime-worker-discovery
      restartPolicy: Always
      terminationGracePeriodSeconds: 90
      nodeSelector:
        karpenter.sh/nodepool: minwm-async-denoiser-h100-8x
        karpenter.sh/capacity-type: spot
        seedleap.ai/model-cache-storage: local-nvme
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        seLinuxOptions:
          type: spc_t
      initContainers:
        - name: model-stager
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -lc]
          env:
            - name: SOURCE_MODEL
              value: /checkpoint-archive/world-model/minwm/serving-artifacts/wan22-5b-varlen-product-ws1-720p-0810-5bfc5d2/gs1500-dmd47-step3200-full-v1/model
            - name: CACHED_MODEL
              value: /model-cache/wan22-5b-varlen-product-ws1-720p-0810-5bfc5d2/gs1500-dmd47-step3200-full-v1/model
          args:
            - |
              set -euo pipefail
              exec 9>/var/run/minwm-startup-lock/tianpeng-model-cache.lock
              flock -x 9
              if [[ ! -f "${CACHED_MODEL}/_READY" ]]; then
                staging="${CACHED_MODEL}.staging.$$"
                rm -rf "${staging}"
                mkdir -p "$(dirname "${CACHED_MODEL}")"
                cp -av "${SOURCE_MODEL}" "${staging}"
                test -f "${staging}/_READY"
                test -f "${staging}/model_index.json"
                test -d "${staging}/transformer"
                rm -rf "${CACHED_MODEL}"
                mv "${staging}" "${CACHED_MODEL}"
              fi
              flock -u 9
          resources:
            requests: {cpu: "2", memory: 2Gi, ephemeral-storage: 1Gi}
            limits: {cpu: "4", memory: 4Gi, ephemeral-storage: 2Gi}
          volumeMounts:
            - {name: checkpoint-archive, mountPath: /checkpoint-archive, readOnly: true}
            - {name: model-cache, mountPath: /model-cache}
            - {name: startup-lock, mountPath: /var/run/minwm-startup-lock}
        - name: denoiser-heartbeat
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python3 -m sglang.multimodal_gen.runtime.entrypoints.realtime_worker_heartbeat
              --coordinator-url=http://minwm-realtime-coordinator:18081
              --health-url=http://127.0.0.1:30000/health
              --state-url=http://127.0.0.1:30000/v1/realtime_worker/state
              --worker-id=$(POD_UID)
              --worker-epoch-file=/var/run/minwm-worker/epoch
              --role=denoiser
              --endpoint=ws://$(POD_IP):30000/v1/realtime_video/generate
              --reservation-endpoint=http://$(POD_IP):30000/v1/realtime_worker
              --node-name=$(NODE_NAME)
              --capacity=4
              --model-revision=wan22-5b-varlen-product-ws1-720p-0810-5bfc5d2-gs1500-direct
              --vae-fingerprint=taew2_2-product-direct-d053e216
              --interval-s=5
          env:
            - {name: SGLANG_LIGHTWEIGHT_RUNTIME, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: worker-epoch, mountPath: /var/run/minwm-worker}
      containers:
        - name: denoiser
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          workingDir: /opt/sglang
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: WORKER_EPOCH_FILE, value: /var/run/minwm-worker/epoch}
            - name: MINWM_MODEL
              value: /model-cache/wan22-5b-varlen-product-ws1-720p-0810-5bfc5d2/gs1500-dmd47-step3200-full-v1/model
            - {name: REALTIME_MAX_SESSIONS, value: "4"}
            - {name: TAEHV_CHECKPOINT_PATH, value: /opt/taehv/taew2_2.pth}
            - {name: MINWM_ATTENTION_IMPL, value: packed}
            - {name: MINWM_PACKED_ATTENTION_DETERMINISTIC, value: "false"}
            - {name: MINWM_NATIVE_COMPONENTS, value: "text_encoder,vae"}
            - {name: SGLANG_DIFFUSION_VAE_CHANNELS_LAST_3D, value: "false"}
            - {name: OTEL_SERVICE_NAME, value: tianpeng-direct-denoiser}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://minwm-realtime-adot:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=minwm,deployment.environment=production,worker.role=denoiser,model.name=tianpeng-direct
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              test -f "${MINWM_MODEL}/_READY"
              test -f "${MINWM_MODEL}/model_index.json"
              test -d "${MINWM_MODEL}/transformer"
              exec 9>/var/run/minwm-startup-lock/denoiser-0.lock
              flock -x 9
              python3 -m sglang.multimodal_gen.runtime.launch_server \
                --model-path "${MINWM_MODEL}" \
                --model-id wan22-5b-varlen-product-ws1-720p-0810-5bfc5d2-gs1500-direct \
                --pipeline-class-name MinWMCausalDMDPipeline \
                --attention-backend fa \
                --performance-mode speed \
                --num-gpus 2 \
                --tp-size 1 \
                --sp-degree 2 \
                --ulysses-degree 2 \
                --ring-degree 1 \
                --enable-cfg-parallel false \
                --enable-torch-compile false \
                --warmup-mode off \
                --batching-max-size 1 \
                --batching-delay-ms 2 \
                --realtime-max-sessions "${REALTIME_MAX_SESSIONS}" \
                --realtime-max-sessions-per-worker "${REALTIME_MAX_SESSIONS}" \
                --realtime-remote-vae-enabled \
                --realtime-session-idle-timeout-s 0 \
                --realtime-session-max-lifetime-s 0 \
                --realtime-admission-wait-s 10 \
                --realtime-causal-sink-size 8 \
                --realtime-causal-kv-cache-num-frames 32 \
                --enable-trace \
                --otlp-traces-endpoint "${OTEL_EXPORTER_OTLP_ENDPOINT}" \
                --host 0.0.0.0 \
                --port 30000 &
              child=$!
              terminate() {
                kill -TERM "${child}" 2>/dev/null || true
                wait "${child}" || true
                exit 143
              }
              trap terminate TERM INT
              until curl --fail --silent --max-time 2 \
                http://127.0.0.1:30000/health >/dev/null; do
                if ! kill -0 "${child}" 2>/dev/null; then
                  wait "${child}"
                  exit $?
                fi
                sleep 2
              done
              flock -u 9
              wait "${child}"
          ports:
            - {name: api, containerPort: 30000}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    deadline=$(( $(date +%s) + 80 ))
                    curl --fail --silent --max-time 3 \
                      -H 'content-type: application/json' \
                      --data "{\"deadline\":${deadline}}" \
                      http://127.0.0.1:30000/v1/realtime_worker/drain
                    for _ in $(seq 1 38); do
                      state=$(curl --fail --silent --max-time 2 \
                        http://127.0.0.1:30000/v1/realtime_worker/state) || break
                      echo "${state}" | grep -q '"active_sessions":0' && break
                      sleep 2
                    done
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 270
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: api}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "24"
              memory: 300Gi
              ephemeral-storage: 24Gi
              nvidia.com/gpu: "2"
            limits:
              cpu: "40"
              memory: 400Gi
              ephemeral-storage: 32Gi
              nvidia.com/gpu: "2"
          securityContext:
            capabilities:
              add: [SYS_ADMIN]
          volumeMounts:
            - {name: model-cache, mountPath: /model-cache, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
            - {name: worker-epoch, mountPath: /var/run/minwm-worker}
            - {name: startup-lock, mountPath: /var/run/minwm-startup-lock}
      volumes:
        - name: checkpoint-archive
          persistentVolumeClaim: {claimName: minwm-async-west-s3, readOnly: true}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 64Gi}
        - name: startup-lock
          hostPath:
            path: /var/run/minwm-startup-lock
            type: DirectoryOrCreate
        - name: model-cache
          hostPath:
            path: /mnt/k8s-disks/0/minwm-model-cache
            type: DirectoryOrCreate
        - name: worker-epoch
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tianpeng-direct-realtime-gateway
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: tianpeng-direct-realtime-gateway
    app.kubernetes.io/part-of: minwm-realtime
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tianpeng-direct-realtime-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tianpeng-direct-realtime-gateway
        app.kubernetes.io/part-of: minwm-realtime
    spec:
      serviceAccountName: minwm-realtime-gateway
      terminationGracePeriodSeconds: 30
      nodeSelector:
        karpenter.sh/nodepool: minwm-realtime-cpu
      tolerations:
        - key: seedleap.ai/task
          operator: Equal
          value: minwm-realtime-cpu
          effect: NoSchedule
      containers:
        - name: gateway
          image: REPLACE_WITH_GATEWAY_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python -m sglang.multimodal_gen.runtime.entrypoints.realtime_gateway_server
              --host=0.0.0.0
              --port=18080
              --coordinator-url=http://minwm-realtime-coordinator:18081
              --model-revision=wan22-5b-varlen-product-ws1-720p-0810-5bfc5d2-gs1500-direct
              --vae-fingerprint=taew2_2-product-direct-d053e216
              --internal-output-url=ws://${POD_IP}:18080/v1/internal/realtime_output
              --output-queue-depth=64
              --output-enqueue-timeout-s=0
              --output-drain-timeout-s=90
              --lease-renew-interval-s=10
              --release-grace-s=0.5
              --trace-log-group=${TRACE_LOG_GROUP}
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: TRACE_LOG_GROUP
              value: REPLACE_WITH_TRACE_LOG_GROUP
            - name: AWS_REGION
              value: REPLACE_WITH_AWS_REGION
            - name: AWS_DEFAULT_REGION
              value: REPLACE_WITH_AWS_REGION
            - {name: OTEL_SERVICE_NAME, value: tianpeng-direct-gateway}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://minwm-realtime-adot:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=minwm,deployment.environment=production,model.name=tianpeng-direct
          ports:
            - {name: http, containerPort: 18080}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tianpeng-direct-realtime-gateway
  namespace: minwm-realtime
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tianpeng-direct-realtime-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: tianpeng-direct-public
  namespace: minwm-realtime
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "18080"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: tianpeng-direct-realtime-gateway
  ports:
    - {name: http, port: 80, targetPort: http}
