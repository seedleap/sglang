apiVersion: v1
kind: PersistentVolume
metadata:
  name: minwm-model-serving-east2-s3-pv
  labels:
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  capacity:
    storage: 1200Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  csi:
    driver: s3.csi.aws.com
    volumeHandle: minwm-model-serving-east2-s3-20260814
    volumeAttributes:
      bucketName: leap-world-model-serving-829115578968-us-east-2
      mount-timeout-seconds: "300"
  mountOptions:
    - region us-east-2
    - --read-part-size 25165824
    - --maximum-throughput-gbps 100
    - --metadata-ttl 3600
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minwm-model-serving-east2-s3
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: minwm-model-serving-east2-s3-pv
  resources:
    requests:
      storage: 1200Gi
