apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zing-denoiser
  namespace: minwm-west2-haoze-20260813
  labels:
    app.kubernetes.io/name: zing-denoiser
    app.kubernetes.io/part-of: minwm-west2-haoze-20260813
spec:
  replicas: 1
  serviceName: zing-denoiser-headless
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  selector:
    matchLabels:
      app.kubernetes.io/name: zing-denoiser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zing-denoiser
        app.kubernetes.io/part-of: minwm-west2-haoze-20260813
        seedleap.ai/model: zing-haoze-dmd47-gs3200
      annotations:
        seedleap.ai/model-source: s3-leap-world-us-west-2-dmd47-gs3200-ema-student
        seedleap.ai/gpu-topology: b300-2gpu-sp2
        seedleap.ai/code-git-ref: e0ae95cbbc47d3ab31d498eae6c0a2773ae54457
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: "false"
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: "false"
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
    spec:
      terminationGracePeriodSeconds: 90
      nodeSelector:
        kubernetes.io/hostname: ip-172-31-42-99.us-west-2.compute.internal
      tolerations:
        - {key: seedleap.ai/workload, operator: Equal, value: wan22-ti2v, effect: NoSchedule}
        - {key: seedleap.ai/service, operator: Equal, value: minwm-west2-haoze-20260813, effect: NoSchedule}
      securityContext:
        seLinuxOptions: {type: spc_t}
      initContainers:
        - name: model-stager
          image: 107014413969.dkr.ecr.us-west-2.amazonaws.com/leap-world/minwm-realtime@sha256:880c7afde5a579aeb04a3b14da45475046ff795e8ea8e0a0af5634eebfb4fc42
          command: [/bin/bash, -lc]
          env:
            - name: SOURCE_MODEL
              value: /artifacts/wan22-5b-stage3-dmd-47-0808-2fb2cfec2a2/gs3200-ema-student-v1/model
            - name: CACHED_MODEL
              value: /model-cache/zing-dmd47-gs3200/model
          args:
            - |
              set -euo pipefail
              exec 9>/startup-lock/zing-model.lock
              flock -x 9
              if [[ ! -f "${CACHED_MODEL}/_READY" ]]; then
                staging="${CACHED_MODEL}.staging.$$"
                rm -rf "${staging}"
                mkdir -p "$(dirname "${CACHED_MODEL}")" "${staging}"
                export SOURCE_MODEL staging
                find "${SOURCE_MODEL}" -type d -printf '%P\0' | xargs -0 -r -I{} mkdir -p "${staging}/{}"
                find "${SOURCE_MODEL}" -type f -print0 | xargs -0 -r -P8 -n1 bash -c '
                  src="$1"; relative="${src#"${SOURCE_MODEL}/"}"; cp -a "${src}" "${staging}/${relative}"
                ' _
                test -f "${staging}/_READY"
                test -f "${staging}/model_index.json"
                test -d "${staging}/transformer"
                rm -rf "${CACHED_MODEL}"
                mv "${staging}" "${CACHED_MODEL}"
              fi
              flock -u 9
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "8", memory: 8Gi}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts, readOnly: true}
            - {name: model-cache, mountPath: /model-cache}
            - {name: startup-lock, mountPath: /startup-lock}
        - name: heartbeat
          restartPolicy: Always
          image: 107014413969.dkr.ecr.us-west-2.amazonaws.com/leap-world/minwm-realtime@sha256:880c7afde5a579aeb04a3b14da45475046ff795e8ea8e0a0af5634eebfb4fc42
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python3 -m sglang.multimodal_gen.runtime.entrypoints.realtime_worker_heartbeat
              --coordinator-url=http://coordinator:18081 --health-url=http://127.0.0.1:30000/health
              --state-url=http://127.0.0.1:30000/v1/realtime_worker/state --worker-id=$(POD_UID)
              --worker-epoch-file=/worker-epoch/epoch --role=denoiser
              --endpoint=ws://$(POD_IP):30000/v1/realtime_video/generate
              --reservation-endpoint=http://$(POD_IP):30000/v1/realtime_worker
              --node-name=$(NODE_NAME) --capacity=1
              --model-revision=wan22-5b-stage3-dmd-47-0808-2fb2cfec2a2
              --vae-fingerprint=taew2_2-d053e216 --interval-s=5
          env:
            - {name: SGLANG_LIGHTWEIGHT_RUNTIME, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: worker-epoch, mountPath: /worker-epoch, readOnly: true}
      containers:
        - name: denoiser
          image: 107014413969.dkr.ecr.us-west-2.amazonaws.com/leap-world/minwm-realtime@sha256:880c7afde5a579aeb04a3b14da45475046ff795e8ea8e0a0af5634eebfb4fc42
          workingDir: /opt/sglang
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: WORKER_EPOCH_FILE, value: /worker-epoch/epoch}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: DENOISER_STARTUP_PARALLELISM, value: "1"}
            - {name: MINWM_MODEL, value: /model-cache/zing-dmd47-gs3200/model}
            - {name: TAEHV_CHECKPOINT_PATH, value: /opt/taehv/taew2_2.pth}
            - {name: MINWM_ATTENTION_IMPL, value: packed}
            - {name: MINWM_PACKED_ATTENTION_DETERMINISTIC, value: "false"}
            - {name: MINWM_NATIVE_COMPONENTS, value: "text_encoder,vae"}
            - {name: SGLANG_DIFFUSION_VAE_CHANNELS_LAST_3D, value: "false"}
            - {name: NCCL_DEBUG, value: WARN}
            - {name: NCCL_PROTO, value: Simple}
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              test -f "${MINWM_MODEL}/_READY"
              test -f "${MINWM_MODEL}/model_index.json"
              test -d "${MINWM_MODEL}/transformer"
              ordinal="${POD_NAME##*-}"
              slot=$((ordinal % DENOISER_STARTUP_PARALLELISM))
              exec 9>"/startup-lock/denoiser-${slot}.lock"
              flock -x 9
              python3 -m sglang.multimodal_gen.runtime.launch_server \
                --model-path "${MINWM_MODEL}" \
                --pipeline-class-name MinWMCausalDMDPipeline \
                --attention-backend fa --performance-mode speed \
                --num-gpus 2 --tp-size 1 --sp-degree 2 --ulysses-degree 2 --ring-degree 1 \
                --enable-cuda-graph --enable-cfg-parallel false --enable-torch-compile false \
                --warmup-mode off --batching-max-size 1 --batching-delay-ms 2 \
                --realtime-max-sessions 1 --realtime-max-sessions-per-worker 1 \
                --realtime-remote-vae-enabled --realtime-session-idle-timeout-s 60 \
                --realtime-session-max-lifetime-s 90 --realtime-admission-wait-s 10 \
                --realtime-causal-sink-size 8 --realtime-causal-kv-cache-num-frames 32 \
                --host 0.0.0.0 --port 30000 &
              child=$!
              terminate() {
                kill -TERM "${child}" 2>/dev/null || true
                wait "${child}" || true
                exit 143
              }
              trap terminate TERM INT
              until curl --fail --silent --max-time 2 http://127.0.0.1:30000/health >/dev/null; do
                if ! kill -0 "${child}" 2>/dev/null; then
                  wait "${child}"
                  exit $?
                fi
                sleep 2
              done
              flock -u 9
              wait "${child}"
          ports:
            - {name: api, containerPort: 30000}
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 270
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: api}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: "24", memory: 300Gi, ephemeral-storage: 24Gi, nvidia.com/gpu: "2"}
            limits: {cpu: "40", memory: 400Gi, ephemeral-storage: 48Gi, nvidia.com/gpu: "2"}
          volumeMounts:
            - {name: model-cache, mountPath: /model-cache, readOnly: true}
            - {name: startup-lock, mountPath: /startup-lock}
            - {name: shm, mountPath: /dev/shm}
            - {name: worker-epoch, mountPath: /worker-epoch}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: serving-artifacts, readOnly: true}
        - name: model-cache
          hostPath: {path: /var/lib/minwm-west2-haoze-model-cache, type: DirectoryOrCreate}
        - name: startup-lock
          hostPath: {path: /var/run/minwm-west2-haoze-startup-lock, type: DirectoryOrCreate}
        - {name: worker-epoch, emptyDir: {}}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 64Gi}
