apiVersion: v1
kind: Service
metadata:
  name: lingbot2-async-denoiser-headless
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: lingbot2-async-denoiser
    app.kubernetes.io/part-of: minwm-realtime
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: lingbot2-async-denoiser
  ports:
    - {name: api, port: 30000, targetPort: api}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lingbot2-async-denoiser
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: lingbot2-async-denoiser
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/test-run: minwm-async-vae-benchmark
    seedleap.ai/ttl-after-test: required
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: lingbot2-async-denoiser-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: lingbot2-async-denoiser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lingbot2-async-denoiser
        app.kubernetes.io/part-of: minwm-realtime
        seedleap.ai/test-run: minwm-async-vae-benchmark
    spec:
      serviceAccountName: minwm-realtime-worker-discovery
      restartPolicy: Always
      terminationGracePeriodSeconds: 90
      nodeSelector:
        karpenter.sh/nodepool: minwm-async-denoiser-h100-8x
        karpenter.sh/capacity-type: spot
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        seLinuxOptions:
          type: spc_t
      initContainers:
        - name: model-stager
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -lc]
          env:
            - name: SOURCE_MODEL
              value: /checkpoint-archive/world-model/minwm/serving-artifacts/lingbot2/59cccf49f2d2dd27418ae7a04b82b10868d455c2/model
            - name: CACHED_MODEL
              value: /model-cache/lingbot2/59cccf49f2d2dd27418ae7a04b82b10868d455c2/model
          args:
            - |
              set -euo pipefail
              exec 9>/var/run/minwm-startup-lock/lingbot2-model-cache.lock
              flock -x 9
              if [[ ! -f "${CACHED_MODEL}/_READY" ]]; then
                staging="${CACHED_MODEL}.staging.$$"
                rm -rf "${staging}"
                mkdir -p "$(dirname "${CACHED_MODEL}")" "${staging}"
                export SOURCE_MODEL staging
                find "${SOURCE_MODEL}" -type d -printf '%P\0' \
                  | xargs -0 -r -I{} mkdir -p "${staging}/{}"
                find "${SOURCE_MODEL}" -type f -print0 \
                  | xargs -0 -r -P8 -n1 bash -c '
                      src="$1"
                      relative="${src#"${SOURCE_MODEL}/"}"
                      cp -a "${src}" "${staging}/${relative}"
                    ' _
                test -f "${staging}/_READY"
                test -f "${staging}/model_index.json"
                test -d "${staging}/transformer"
                rm -rf "${CACHED_MODEL}"
                mv "${staging}" "${CACHED_MODEL}"
              fi
              flock -u 9
          resources:
            requests: {cpu: "2", memory: 2Gi, ephemeral-storage: 1Gi}
            limits: {cpu: "4", memory: 4Gi, ephemeral-storage: 2Gi}
          volumeMounts:
            - {name: checkpoint-archive, mountPath: /checkpoint-archive, readOnly: true}
            - {name: model-cache, mountPath: /model-cache}
            - {name: startup-lock, mountPath: /var/run/minwm-startup-lock}
        - name: denoiser-heartbeat
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python3 -m sglang.multimodal_gen.runtime.entrypoints.realtime_worker_heartbeat
              --coordinator-url=http://minwm-realtime-coordinator:18081
              --health-url=http://127.0.0.1:30000/health
              --state-url=http://127.0.0.1:30000/v1/realtime_worker/state
              --worker-id=$(POD_UID)
              --worker-epoch-file=/var/run/minwm-worker/epoch
              --role=denoiser
              --endpoint=ws://$(POD_IP):30000/v1/realtime_video/generate
              --reservation-endpoint=http://$(POD_IP):30000/v1/realtime_worker
              --node-name=$(NODE_NAME)
              --capacity=4
              --model-revision=robbyant/lingbot-world-v2-14b-causal-fast-diffusers
              --vae-fingerprint=taew2_1-d26151e7
              --interval-s=5
          env:
            - {name: SGLANG_LIGHTWEIGHT_RUNTIME, value: "1"}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: worker-epoch, mountPath: /var/run/minwm-worker}
      containers:
        - name: denoiser
          image: REPLACE_WITH_DENOISER_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          workingDir: /opt/sglang
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: WORKER_EPOCH_FILE, value: /var/run/minwm-worker/epoch}
            - name: LINGBOT2_MODEL
              value: /model-cache/lingbot2/59cccf49f2d2dd27418ae7a04b82b10868d455c2/model
            - {name: SGLANG_LINGBOT_LAZY_VAE_ENCODE_BLACK_FRAMES, value: "0"}
            - {name: SGLANG_LINGBOT_ENABLE_INTERACTIVE_KV_WINDOW, value: "false"}
            - {name: SGLANG_DIFFUSION_STAGE_LOGGING, value: "true"}
            - {name: SGLANG_DIFFUSION_VAE_CHANNELS_LAST_3D, value: "false"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: expandable_segments:True}
            - {name: NCCL_DEBUG, value: WARN}
            - {name: NCCL_PROTO, value: Simple}
            - {name: OTEL_SERVICE_NAME, value: lingbot2-realtime-denoiser}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://minwm-realtime-adot:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=minwm,deployment.environment=production,worker.role=denoiser,model.name=lingbot2
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              test -f "${LINGBOT2_MODEL}/_READY"
              test -f "${LINGBOT2_MODEL}/model_index.json"
              python3 - <<'PYREADY'
              import os

              ready_file = "/tmp/lingbot2-720p-ready"
              try:
                  os.unlink(ready_file)
              except FileNotFoundError:
                  pass
              PYREADY
              exec 9>/var/run/minwm-startup-lock/denoiser-0.lock
              flock -x 9
              python3 -m sglang.multimodal_gen.runtime.launch_server \
                --model-path "${LINGBOT2_MODEL}" \
                --model-id robbyant/lingbot-world-v2-14b-causal-fast-diffusers \
                --pipeline-class-name LingBotWorldCausalDMDPipeline \
                --attention-backend fa \
                --attention-backend-config lingbot_causal_fa_num_splits=2 \
                --performance-mode speed \
                --num-gpus 4 \
                --tp-size 1 \
                --sp-degree 4 \
                --ulysses-degree 4 \
                --ring-degree 1 \
                --enable-cfg-parallel false \
                --dit-cpu-offload false \
                --text-encoder-cpu-offload true \
                --pin-cpu-memory true \
                --enable-torch-compile false \
                --warmup-mode server \
                --batching-max-size 4 \
                --batching-delay-ms 2 \
                --realtime-max-sessions 4 \
                --realtime-max-sessions-per-worker 4 \
                --realtime-remote-vae-enabled \
                --realtime-session-idle-timeout-s 60 \
                --realtime-session-max-lifetime-s 60 \
                --realtime-admission-wait-s 10 \
                --enable-trace \
                --otlp-traces-endpoint "${OTEL_EXPORTER_OTLP_ENDPOINT}" \
                --host 0.0.0.0 \
                --port 30000 &
              child=$!
              terminate() {
                kill -TERM "${child}" 2>/dev/null || true
                wait "${child}" || true
                exit 143
              }
              trap terminate TERM INT
              until python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:30000/health", timeout=3).read()'; do
                if ! kill -0 "${child}" 2>/dev/null; then
                  wait "${child}"
                  exit $?
                fi
                sleep 2
              done
              if ! python3 /opt/sglang/python/sglang/multimodal_gen/runtime/realtime/startup_warmup.py \
                --model robbyant/lingbot-world-v2-14b-causal-fast-diffusers \
                --timeout-s 180 \
                --allow-empty-complete \
                --ready-file /tmp/lingbot2-720p-ready; then
                kill -TERM "${child}" 2>/dev/null || true
                wait "${child}" || true
                exit 1
              fi
              flock -u 9
              wait "${child}"
          ports:
            - {name: api, containerPort: 30000}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    deadline=$(( $(date +%s) + 80 ))
                    curl --fail --silent --max-time 3 \
                      -H 'content-type: application/json' \
                      --data "{\"deadline\":${deadline}}" \
                      http://127.0.0.1:30000/v1/realtime_worker/drain
                    for _ in $(seq 1 38); do
                      state=$(curl --fail --silent --max-time 2 \
                        http://127.0.0.1:30000/v1/realtime_worker/state) || break
                      echo "${state}" | grep -q '"active_sessions":0' && break
                      sleep 2
                    done
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 270
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: api}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "40"
              memory: 600Gi
              ephemeral-storage: 24Gi
              nvidia.com/gpu: 4
            limits:
              cpu: "88"
              memory: 1200Gi
              ephemeral-storage: 48Gi
              nvidia.com/gpu: 4
          securityContext:
            capabilities:
              add: [SYS_ADMIN]
          volumeMounts:
            - {name: model-cache, mountPath: /model-cache, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
            - {name: worker-epoch, mountPath: /var/run/minwm-worker}
            - {name: startup-lock, mountPath: /var/run/minwm-startup-lock}
      volumes:
        - name: checkpoint-archive
          persistentVolumeClaim: {claimName: minwm-async-west-s3, readOnly: true}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 64Gi}
        - name: startup-lock
          hostPath:
            path: /var/run/minwm-startup-lock
            type: DirectoryOrCreate
        - name: model-cache
          hostPath:
            path: /var/lib/minwm-model-cache
            type: DirectoryOrCreate
        - name: worker-epoch
          emptyDir: {}
