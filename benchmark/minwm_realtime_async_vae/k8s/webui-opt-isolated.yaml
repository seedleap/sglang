apiVersion: apps/v1
kind: Deployment
metadata:
  name: minwm-dual-webui-opt-20260812
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: minwm-dual-webui-opt-20260812
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-dual-webui-opt-20260812
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-dual-webui-opt-20260812
        app.kubernetes.io/part-of: minwm-realtime
        seedleap.ai/environment: production
      annotations:
        seedleap.ai/code-git-ref: d76f5795b4cbf970c103f79a072bc4c320581b07
        seedleap.ai/revision: h264-unpaced-20260817-v1
        seedleap.ai/webui-build: h264-unpaced-20260817-v1
        seedleap.ai/webui-profile: happyoyster-sbs-smooth-timeline
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
        karpenter.sh/nodepool: minwm-realtime-cpu
      tolerations:
        - key: seedleap.ai/task
          operator: Equal
          value: minwm-realtime-cpu
          effect: NoSchedule
