apiVersion: v1
kind: Service
metadata:
  name: minwm-webui-opt-gateway-20260813
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: minwm-webui-opt-gateway-20260813
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/environment: production
spec:
  selector:
    app.kubernetes.io/name: minwm-webui-opt-gateway-20260813
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minwm-webui-opt-gateway-20260813
  namespace: minwm-realtime
  labels:
    app.kubernetes.io/name: minwm-webui-opt-gateway-20260813
    app.kubernetes.io/part-of: minwm-realtime
    seedleap.ai/environment: production
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: minwm-webui-opt-gateway-20260813
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minwm-webui-opt-gateway-20260813
        app.kubernetes.io/part-of: minwm-realtime
        seedleap.ai/environment: production
      annotations:
        seedleap.ai/code-git-ref: d20915b43a2cb31f66bf7ccc8c4ad34ab3560502
        seedleap.ai/webui-profile: isolated-interactive-ack
    spec:
      serviceAccountName: minwm-realtime-gateway
      terminationGracePeriodSeconds: 30
      nodeSelector:
        karpenter.sh/nodepool: minwm-realtime-cpu
      tolerations:
        - key: seedleap.ai/task
          operator: Equal
          value: minwm-realtime-cpu
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: minwm-webui-opt-gateway-20260813
      containers:
        - name: gateway
          image: 829115578968.dkr.ecr.us-east-2.amazonaws.com/leap-world/minwm-realtime@sha256:b14d3a3583ce35810730c0973554aaef0beb337753552e5248ef5de5d927ff52
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              exec python -m sglang.multimodal_gen.runtime.entrypoints.realtime_gateway_server
              --host=0.0.0.0
              --port=18080
              --coordinator-url=http://minwm-realtime-coordinator:18081
              --model-revision=${MODEL_REVISION}
              --lingbot2-model-revision=${LINGBOT2_MODEL_REVISION}
              --vae-fingerprint=${VAE_FINGERPRINT}
              --lingbot2-vae-fingerprint=${LINGBOT2_VAE_FINGERPRINT}
              --internal-output-url=ws://${POD_IP}:18080/v1/internal/realtime_output
              --output-queue-depth=64
              --output-enqueue-timeout-s=0
              --output-drain-timeout-s=90
              --lease-renew-interval-s=10
              --release-grace-s=0.5
              --trace-log-group=${TRACE_LOG_GROUP}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - {name: MODEL_REVISION, value: wan22-5b-stage3-dmd-47-0808-2fb2cfec2a2}
            - {name: VAE_FINGERPRINT, value: taew2_2-d053e216}
            - {name: LINGBOT2_MODEL_REVISION, value: robbyant/lingbot-world-v2-14b-causal-fast-diffusers}
            - {name: LINGBOT2_VAE_FINGERPRINT, value: taew2_1-d26151e7}
            - {name: TRACE_LOG_GROUP, value: /aws/eks/minwm/realtime-traces-benchmark}
            - {name: AWS_REGION, value: us-east-2}
            - {name: AWS_DEFAULT_REGION, value: us-east-2}
            - {name: OTEL_SERVICE_NAME, value: minwm-webui-opt-gateway-20260813}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://minwm-realtime-adot:4317}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: service.namespace=minwm,deployment.environment=production,webui.profile=opt-20260813}
          ports:
            - {name: http, containerPort: 18080}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
