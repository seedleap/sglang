[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lingbot-batch-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34,<2",
  "fastapi>=0.115,<1",
  "msgspec>=0.18,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[tool.setuptools]
packages = ["lingbot_batch_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
