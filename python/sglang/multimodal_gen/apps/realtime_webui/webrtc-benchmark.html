<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zing · H.264 WebRTC/RTP 并发实验</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#080c0b; color:#eaf5ef; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:radial-gradient(circle at 15% 0,#143329 0,transparent 34%),#080c0b; }
      header { display:flex; justify-content:space-between; gap:24px; align-items:center; padding:22px 32px; border-bottom:1px solid #23352f; background:#09100edd; position:sticky; top:0; z-index:3; }
      h1 { margin:3px 0 0; font-size:24px; } .eyebrow { color:#6fe3b1; font-size:12px; letter-spacing:.18em; font-weight:800; }
      a { color:#86edc0; text-decoration:none; }
      main { padding:24px 32px 50px; }
      .controls { display:grid; grid-template-columns:repeat(6,minmax(130px,1fr)); gap:12px; padding:16px; border:1px solid #27443a; border-radius:16px; background:#0d1512e8; }
      label { display:flex; flex-direction:column; gap:7px; color:#91a69d; font-size:12px; }
      select,input,button { height:42px; border:1px solid #35544a; border-radius:10px; background:#101c18; color:#effaf5; padding:0 12px; font:inherit; }
      button { cursor:pointer; font-weight:750; } button.primary { background:#47d79a; color:#06120d; border-color:#47d79a; } button.danger { color:#ffadad; }
      .summary { margin:14px 0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; color:#9fb3aa; }
      .pill { padding:7px 10px; border-radius:999px; background:#13211c; border:1px solid #29483d; }
      .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:16px; }
      .tile { border:1px solid #2b443c; border-radius:16px; overflow:hidden; background:#0b1210; min-height:300px; }
      .tile header { position:static; padding:11px 14px; background:#111b18; border-bottom:1px solid #273a34; }
      .tile iframe { width:100%; aspect-ratio:16/9; display:block; border:0; background:#050706; }
      .tile .waiting { min-height:236px; display:grid; place-items:center; color:#7e938a; }
      .metrics { padding:10px 14px 13px; color:#8ea39a; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .keys { display:flex; gap:8px; align-items:center; } kbd { min-width:30px; text-align:center; padding:6px 8px; border-radius:7px; border:1px solid #43665a; background:#14241e; }
      .error { color:#ff9d9d; }
      @media(max-width:980px){ .controls{grid-template-columns:repeat(2,1fr)} main,header{padding-left:16px;padding-right:16px}.tiles{grid-template-columns:1fr} }
    </style>
  </head>
  <body>
    <header>
      <div><div class="eyebrow">ISOLATED TRANSPORT LAB</div><h1>Zing · H.264 WebRTC/RTP 并发实验</h1></div>
      <a href="./">打开 WebSocket WebP/JPEG 基线页面 →</a>
    </header>
    <main>
      <section class="controls">
        <label>测试场景<select id="preset"></select></label>
        <label>并发用户<select id="users"><option>1</option><option>2</option><option selected>4</option><option>6</option><option>8</option></select></label>
        <label>视频编码<select id="codec"><option value="h264">H.264 baseline</option></select></label>
        <label>目标码率<input id="bitrate" type="number" min="250" max="20000" value="3500" /></label>
        <button class="primary" id="start">启动并发测试</button>
        <button class="danger" id="stop">停止全部会话</button>
      </section>
      <div class="summary">
        <span class="pill" id="state">等待开始</span>
        <span class="pill">视频：H.264 → RTP/SRTP → WebRTC</span>
        <span class="pill">控制：轻量 WebSocket</span>
        <span class="keys">统一按键 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span>
      </div>
      <section id="tiles" class="tiles"></section>
    </main>
    <script src="./webrtc-benchmark.js?v=1"></script>
  </body>
</html>
